name: Haskell CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  merge_group:
  push:
    branches:
      - master
      - "release/*"

# Mirrors the compiler matrix of the downstream consumers (ouroboros-network
# builds 9.6-9.14 natively on Windows; ouroboros-consensus 9.6-9.14 on Linux;
# cardano-node 9.6/9.12/9.14 incl. Windows), so that a hermod release is known
# to build wherever it will be pinned.
jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.6", "9.8", "9.10", "9.12", "9.14"]
        os: [ubuntu-latest, windows-latest]

    env:
      # Modify this value to "invalidate" all cabal caches.
      CABAL_CACHE_VERSION: "2026-09-18"

    steps:

    - name: "Install System Dependencies via pacman (msys2)"
      if: runner.os == 'Windows'
      shell: 'C:/msys64/usr/bin/bash.exe -e {0}'
      run: |
        /usr/bin/pacman -S --noconfirm mingw-w64-x86_64-pkg-config mingw-w64-x86_64-sed base-devel autoconf-wrapper autoconf automake libtool make

    - name: Install Haskell
      uses: input-output-hk/actions/haskell@latest
      id: setup-haskell
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: "3.12.1.0"

    - uses: actions/checkout@v4

    - name: Update PATH
      if: runner.os == 'Windows'
      run: |
        $env:PATH=("C:\msys64\mingw64\bin;{0}" -f $env:PATH)
        echo "PATH=$env:PATH" >> $env:GITHUB_ENV

    - name: Update Hackage and CHaP
      run: cabal update

    - name: Record dependencies
      id: record-deps
      run: |
        cabal build all --dry-run
        cat dist-newstyle/cache/plan.json | jq -r '."install-plan"[] | select(.style != "local") | .id' | sort | uniq > dependencies.txt

    - uses: actions/cache/restore@v4
      name: "Restore cache: `cabal store`"
      id: cache-dependencies
      with:
        path: ${{ steps.setup-haskell.outputs.cabal-store }}
        key: cache-dependencies-${{ env.CABAL_CACHE_VERSION }}-${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('dependencies.txt') }}
        restore-keys: cache-dependencies-${{ env.CABAL_CACHE_VERSION }}-${{ runner.os }}-${{ matrix.ghc }}

    - name: Build dependencies
      run: cabal build --only-dependencies all -j

    - uses: actions/cache/save@v4
      name: "Save cache: `cabal store`"
      if: always() && steps.cache-dependencies.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.setup-haskell.outputs.cabal-store }}
        key: ${{ steps.cache-dependencies.outputs.cache-primary-key }}

    - name: Build all packages
      run: cabal build all -j

    - name: hermod-tracing-api [test]
      run: cabal test hermod-tracing-api --test-show-details=direct

    - name: hermod-tracing-core [test]
      run: cabal test hermod-tracing-core --test-show-details=direct

    - name: hermod-trace-resources [test]
      run: cabal test hermod-trace-resources --test-show-details=direct
